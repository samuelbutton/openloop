name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pre-commit run --all-files
      - run: uv run --locked pyright
      - run: uv run --locked pytest
