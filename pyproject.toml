[project]
name = "openloop"
version = "0.1.0"
description = "Openloop"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mlx>=0.32.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "mlx-lm>=0.32.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
