[project]
name = "openloop"
version = "0.1.0"
description = "Openloop"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mlx>=0.32.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "mlx-lm>=0.32.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "pyarrow>=23,<24",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
benchmarks = [
    "gdown>=6.4.1",
    "nas-bench-201>=2.1",
    "torch>=2.14.1",
    "xgboost>=3.4.1",
]
dev = [
    "hypothesis>=6.168,<7",
    "pre-commit>=4,<5",
    "pyright>=1.1.414,<2",
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "PERF", "RET"]

[tool.ruff.lint.per-file-ignores]
# Recorded research scripts are frozen evidence; their assert style stays as run.
"research/**" = ["PT018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
exclude = ["research", "**/__pycache__"]
typeCheckingMode = "standard"
strict = ["src/openloop/ledger", "src/openloop/probe.py"]
